services:
  - type: web
    name: agrismart-backend
    runtime: python
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python app/manage.py collectstatic --noinput && python app/manage.py migrate --noinput"
    startCommand: "gunicorn --chdir app agrismart.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: WEATHER_PROVIDER
        value: "weatherapi"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: DATABASE_URL
        fromDatabase:
          name: agrismart-db
          property: connectionString

databases:
  - name: agrismart-db
    plan: free
