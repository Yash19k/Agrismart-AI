services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrismart_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-secret-key-change-me-in-production-123456789
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgres://agrismart_user:agrismart_pass@db:5432/agrismart_db
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - WEATHER_API_KEY=${WEATHER_API_KEY:-093b53ee057a4907ab9104918261209}
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-weatherapi}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_media:/workspace/app/media

  db:
    image: postgres:15-alpine
    container_name: agrismart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrismart_db
      POSTGRES_USER: agrismart_user
      POSTGRES_PASSWORD: agrismart_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrismart_user -d agrismart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_media:
